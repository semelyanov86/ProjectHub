# nFPM configuration used by `wails3 tool package` (task deb / task linux:create:deb).
# Documentation: https://nfpm.goreleaser.com/configuration/
#
# PROJECTHUB_VERSION, GOARCH and SOURCE_DATE_EPOCH are exported by the Taskfile
# (VERSION file, target architecture, last commit time for reproducible mtimes).
# Staged files under bin/package/ are produced by `task linux:stage:package`.

name: "projecthub"
arch: "${GOARCH}"
platform: "linux"
version: "${PROJECTHUB_VERSION}"
section: "devel"
priority: "optional"
maintainer: "Sergey Emelyanov <semelyanov86@users.noreply.github.com>"
description: |-
  Manage and open development projects
  ProjectHub is a lightweight, local-first desktop project manager. It keeps a
  list of local project directories and opens them in Zed or Sublime Text, in
  Ghostty or another terminal, or in the file manager. It shows read-only Git
  branch information, supports favorites, search and JSON import/export, and
  offers a system tray menu with recently opened projects.
vendor: "Sergey Emelyanov"
homepage: "https://github.com/semelyanov86/ProjectHub"
license: "MIT"

# Runtime libraries of the default Wails 3 GTK4 + WebKitGTK 6.0 build, as
# computed by dpkg-shlibdeps on Ubuntu 24.04 (the build baseline). The same
# package names exist on Ubuntu 26.04. `task deb` re-checks this list against
# dpkg-shlibdeps for every build (build/linux/verify-deb.sh).
depends:
  - libc6 (>= 2.34)
  - libglib2.0-0t64 (>= 2.74.0)
  - libgtk-4-1 (>= 4.13.8)
  - libjavascriptcoregtk-6.0-1
  - libsoup-3.0-0 (>= 2.4.0)
  - libwebkitgtk-6.0-4 (>= 2.39.91)
  - libx11-6
# Git powers the branch/changes indicators; ProjectHub works without it.
recommends:
  - git

contents:
  - src: "./bin/projecthub"
    dst: "/usr/bin/projecthub"
    file_info:
      mode: 0755
  # The desktop file id equals the GTK application id so GNOME on Wayland
  # matches the window to it; StartupWMClass=projecthub covers X11.
  - src: "./build/linux/share/applications/io.github.semelyanov86.projecthub.desktop"
    dst: "/usr/share/applications/io.github.semelyanov86.projecthub.desktop"
    file_info:
      mode: 0644
  - src: "./build/linux/share/metainfo/io.github.semelyanov86.projecthub.metainfo.xml"
    dst: "/usr/share/metainfo/io.github.semelyanov86.projecthub.metainfo.xml"
    file_info:
      mode: 0644
  - src: "./build/icons/projecthub.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/projecthub.svg"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/16x16/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/22x22/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/22x22/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/24x24/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/24x24/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/32x32/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/48x48/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/64x64/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/128x128/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/256x256/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./build/linux/share/icons/hicolor/512x512/apps/projecthub.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/projecthub.png"
    file_info:
      mode: 0644
  - src: "./bin/package/projecthub.1.gz"
    dst: "/usr/share/man/man1/projecthub.1.gz"
    file_info:
      mode: 0644
  - src: "./build/linux/share/doc/projecthub/copyright"
    dst: "/usr/share/doc/projecthub/copyright"
    file_info:
      mode: 0644
  - src: "./bin/package/changelog.gz"
    dst: "/usr/share/doc/projecthub/changelog.gz"
    file_info:
      mode: 0644

# No maintainer scripts: the desktop database, icon cache and man-db index are
# refreshed by dpkg triggers of desktop-file-utils, the icon theme and man-db,
# and removing the package removes every installed file. User configuration in
# ~/.config/projecthub is never created or removed by the package.

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

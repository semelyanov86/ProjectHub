name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24.x"
  TASK_VERSION: v3.54.0
  WAILS_VERSION: v3.1.0
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  build:
    name: Check, build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            dbus git dpkg-dev desktop-file-utils appstream lintian

      - name: Install Task, Wails CLI and golangci-lint
        run: |
          go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify that the tag matches VERSION and the release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: task version:check TAG="$TAG"

      - name: Install frontend dependencies from the lockfile (npm ci)
        run: task common:install:frontend:deps

      - name: Quality checks
        run: task check

      - name: Build the production application and the Debian package (verified)
        run: task deb

      - name: Show package metadata
        run: |
          dpkg-deb --info dist/projecthub_*.deb
          dpkg-deb --contents dist/projecthub_*.deb

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum projecthub_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/projecthub_*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Install and GUI smoke test (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Install the package in a clean container and run the GUI smoke tests
        env:
          IMAGE: ${{ matrix.image }}
        run: bash build/linux/smoke-test.sh dist/projecthub_*.deb "$IMAGE"

      - name: Upload smoke test logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ strategy.job-index }}
          path: dist/smoke/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can write: it creates the release and uploads the assets
    # with the workflow's GITHUB_TOKEN. No personal access token is needed.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create the release with the .deb and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          bash scripts/release-notes.sh "$version" > release-notes.md
          prerelease=()
          if [[ $version == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/projecthub_*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "ProjectHub $version" \
            --notes-file release-notes.md \
            --verify-tag "${prerelease[@]}"

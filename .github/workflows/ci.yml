name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24.x"
  TASK_VERSION: v3.54.0
  WAILS_VERSION: v3.1.0
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  check:
    name: Lint, test, build and package
    # Ubuntu 24.04 is the build baseline: packages built here also install on 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            dbus git dpkg-dev desktop-file-utils appstream lintian

      - name: Install Task, Wails CLI and golangci-lint
        run: |
          go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies from the lockfile (npm ci)
        run: task common:install:frontend:deps

      - name: Version, formatting, lint, TypeScript, Go and frontend tests
        run: task check

      - name: Build the application and the Debian package
        run: task deb

      - name: Upload the Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: projecthub-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Install and GUI smoke test (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: projecthub-deb
          path: dist

      - name: Install the package in a clean container and run the GUI smoke tests
        env:
          IMAGE: ${{ matrix.image }}
        run: bash build/linux/smoke-test.sh dist/projecthub_*.deb "$IMAGE"

      - name: Upload smoke test logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ strategy.job-index }}
          path: dist/smoke/
          if-no-files-found: ignore
          retention-days: 7
